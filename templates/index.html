<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Intelligent Signature Forgery Detection System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>🖋 Intelligent Signature Forgery Detection System</h1>
    <p>Upload two signatures. Our AI will identify the real and forged one.</p>

    <form id="uploadForm">
        <div class="upload-box">
    <label class="file-label">
        <input type="file" name="img1" id="img1" required>
        <span>📁 Upload Signature A</span>
    </label>
    <div class="file-name" id="file-name-1">No file selected</div>
</div>

<div class="upload-box">
    <label class="file-label">
        <input type="file" name="img2" id="img2" required>
        <span>📁 Upload Signature B</span>
    </label>
    <div class="file-name" id="file-name-2">No file selected</div>
</div>

        <button type="submit">Analyze Signatures</button>
    </form>

    <div id="result" class="result hidden"></div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
